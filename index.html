
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raised by Systems</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --deep-teal: #006D77;
            --mustard: #E9C46A;
            --coral: #E76F51;
            --lilac: #CDB4DB;
            --off-white: #F8F9FA;
            --charcoal: #2D3748;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--off-white);
            color: var(--charcoal);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        h1, h2, h3 {
            font-family: 'Poppins', sans-serif;
        }
        .deep-teal { color: var(--deep-teal); }
        .bg-deep-teal { background-color: var(--deep-teal); }
        .mustard { color: var(--mustard); }
        .bg-mustard { background-color: var(--mustard); }
        .coral { color: var(--coral); }
        .bg-coral { background-color: var(--coral); }
        .lilac { color: var(--lilac); }
        .bg-lilac { background-color: var(--lilac); }
        
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: var(--off-white);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--deep-teal);
            border-radius: 10px;
        }

        /* 3D Flip Utilities */
        .perspective-1000 {
            perspective: 1000px;
        }
        .preserve-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        
        /* Ensure the app occupies full height on mobile */
        #root {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Balanced text utility */
        .balanced-text {
            text-wrap: balance;
        }
    </style>
